name: Foundation checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Verify concurrent inventory commands in disposable local PostgreSQL
        shell: bash
        run: |
          trap 'docker rm -fv phase7-postgres >/dev/null 2>&1 || true' EXIT
          docker run -d --name phase7-postgres -e POSTGRES_HOST_AUTH_METHOD=trust -e POSTGRES_DB=phase7_inventory_test -p 127.0.0.1:55432:5432 postgres:17
          for attempt in $(seq 1 30); do
            if docker exec phase7-postgres pg_isready -U postgres -d phase7_inventory_test; then break; fi
            sleep 1
          done
          INVENTORY_TEST_DATABASE_URL=postgresql://postgres@127.0.0.1:55432/phase7_inventory_test npx vitest run tests/inventory-concurrency.test.ts
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Build backend runtime image
        run: docker build -f apps/api/Dockerfile -t lager-api-check .
      - name: Verify diagnostic script exists and loads in runtime without secrets
        shell: bash
        run: |
          set +e
          output=$(docker run --rm lager-api-check node scripts/verify-database.cjs 2>&1)
          result=$?
          set -e
          test "$result" -eq 1
          test "$output" = "DATABASE_URL_MISSING: Required backend secret is absent."
      - name: Verify CA materialization as runtime user with strict TLS
        run: |
          docker run --rm lager-api-check node -e '
            const fs = require("node:fs");
            const { rootCertificates } = require("node:tls");
            const { loadConfig, databaseTls, validateCaPem } = require("./apps/api/dist/config.js");
            const pem = rootCertificates.find(p => { try { validateCaPem(p); return true; } catch { return false; } });
            const path = "/app/certs/supabase-ca.crt";
            const result = databaseTls(loadConfig({ DATABASE_CA_PEM: pem, DATABASE_CA_FILE: path }));
            if (process.getuid() === 0 || result.rejectUnauthorized !== true || fs.readFileSync(path, "utf8") !== result.ca || (fs.statSync(path).mode & 0o777) !== 0o600) process.exit(1);
          '
